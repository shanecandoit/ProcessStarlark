name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test server and documented flows without CGo
        run: CGO_ENABLED=0 go test ./...
      - run: go vet ./...
      - name: Check concurrent database and workspace operations
        run: go test -race ./internal/draftstore ./internal/server ./internal/workspace
      - run: node --test web/*.test.js
      - name: Build WASM and replay guided tours
        run: sh web/build.sh
