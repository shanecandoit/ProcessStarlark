# Lints and tests the whole module. Manual only: run it from the Actions tab
# ("CI" → "Run workflow"), or with `gh workflow run ci.yml`.
# The Playground and Release workflows run the tests on their own as well.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./cmd/park-wasm

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          GOOS=js GOARCH=wasm staticcheck ./cmd/park-wasm

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: test
        run: go test -race ./...

      - name: build
        run: |
          go build ./...
          sh web/build.sh
