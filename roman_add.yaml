version: 1
name: RomanAdd
description: Add two lowercase Roman numerals.
module: roman_add.star
uses: [RomanParse]
functions:
  - function: eval(text) sum
    description: Add two numerals separated by ' + '.
    implementation: eval
    examples:
      - {text: "ix + vi", sum: 15}
      - {text: "vi + ix", sum: 15}
